<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabbatjahr</title>
<style>
  :root {
    --sj-bordeaux: #5c1a2e;
    --sj-bordeaux-dark: #3f0f1f;
    --sj-bordeaux-light: #7d2c44;
    --sj-gold: #c9a227;
    --sj-gold-light: #ddb94f;
    --sj-bg: #faf5ec;
    --sj-bg-card: #fffcf5;
    --sj-bg-hover: #f2e6d3;
    --sj-text: #2c1620;
    --sj-text-soft: #6b4a55;
    --sj-text-muted: #9c8790;
    --sj-border: #e6d9c6;
    --sj-danger: #a13a3a;
    --sj-success: #4f7a5c;
    --sj-radius: 14px;
    --sj-radius-sm: 8px;
    --sj-shadow: 0 4px 20px rgba(67,15,31,0.10);
    --sj-shadow-lg: 0 12px 40px rgba(67,15,31,0.20);
    --sj-transition: 0.15s ease;
    --sj-nav-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--sj-bg);
    color: var(--sj-text);
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, h4 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    color: var(--sj-bordeaux-dark);
    margin: 0 0 0.4em 0;
    font-weight: 600;
  }
  p { line-height: 1.5; }
  button, input, select, textarea { font-family: inherit; font-size: 16px; }
  a { color: var(--sj-bordeaux); }
  #app { min-height: 100vh; }
  .splash {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--sj-text-soft); font-size: 18px; text-align: center; padding: 24px;
  }
  .fatal-error {
    max-width: 560px; margin: 60px auto; padding: 24px; background: #fff3f3;
    border: 1px solid var(--sj-danger); border-radius: var(--sj-radius); color: var(--sj-danger);
  }

  /* ===== Buttons & Inputs ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; min-width: 44px; padding: 10px 18px;
    border-radius: var(--sj-radius-sm); border: 1px solid transparent;
    background: var(--sj-bordeaux); color: #fff; font-weight: 600; cursor: pointer;
    transition: background var(--sj-transition), transform var(--sj-transition);
  }
  .btn:hover { background: var(--sj-bordeaux-light); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--sj-gold); outline-offset: 2px; }
  .btn-gold { background: var(--sj-gold); color: var(--sj-bordeaux-dark); }
  .btn-gold:hover { background: var(--sj-gold-light); }
  .btn-outline { background: transparent; color: var(--sj-bordeaux); border-color: var(--sj-border); }
  .btn-outline:hover { background: var(--sj-bg-hover); }
  .btn-danger { background: var(--sj-danger); color: #fff; }
  .btn-danger:hover { background: #8a2c2c; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  .icon-btn {
    min-width: 44px; min-height: 44px; border-radius: 50%; border: none;
    background: transparent; color: var(--sj-text-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
    transition: background var(--sj-transition);
  }
  .icon-btn:hover { background: var(--sj-bg-hover); }
  .icon-btn:focus-visible { outline: 3px solid var(--sj-gold); outline-offset: 1px; }

  label { display: block; font-size: 14px; font-weight: 600; color: var(--sj-text-soft); margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .field input[type=text], .field input[type=email], .field input[type=password],
  .field input[type=date], .field input[type=url], .field input[type=number],
  .field select, .field textarea {
    width: 100%; padding: 10px 12px; min-height: 44px; border-radius: var(--sj-radius-sm);
    border: 1px solid var(--sj-border); background: #fff; color: var(--sj-text); font-size: 16px;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--sj-gold); outline-offset: 1px; border-color: var(--sj-gold);
  }
  .field-hint { font-size: 12px; color: var(--sj-text-muted); margin-top: 2px; }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field-row > .field { flex: 1; min-width: 140px; }
  .error-text { color: var(--sj-danger); font-size: 14px; margin: 6px 0; }

  /* ===== Login ===== */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--sj-bordeaux-dark), var(--sj-bordeaux) 55%, var(--sj-gold) 140%);
    padding: 20px;
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--sj-bg-card); border-radius: var(--sj-radius);
    padding: 32px 28px; box-shadow: var(--sj-shadow-lg);
  }
  .login-card h1 { font-size: 28px; text-align: center; }
  .login-sub { text-align: center; color: var(--sj-text-soft); margin-bottom: 22px; font-size: 15px; }
  .login-hint { font-size: 12px; color: var(--sj-text-muted); text-align: center; margin-top: 16px; }
  .login-host { font-size: 11px; color: var(--sj-text-muted); text-align: center; margin-top: 8px; word-break: break-all; }

  /* ===== App Shell ===== */
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
  .app-header {
    background: var(--sj-bordeaux-dark); color: #fff; padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .app-header h1 { color: var(--sj-gold-light); font-size: 20px; margin: 0; }
  .app-header .user-name { font-size: 13px; color: #eadfce; }
  .app-body { flex: 1; display: flex; }
  .content { flex: 1; padding: 18px 16px 90px 16px; max-width: 920px; margin: 0 auto; width: 100%; }
  @media (min-width: 768px) { .content { padding: 26px 32px 40px 32px; } }

  /* nav: bottom bar mobile, sidebar desktop */
  .app-nav {
    display: flex; justify-content: space-around; align-items: stretch;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: #fff; border-top: 1px solid var(--sj-border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; min-height: 56px; background: none; border: none; cursor: pointer;
    color: var(--sj-text-muted); font-size: 11px; font-weight: 600; padding: 6px 2px;
  }
  .nav-item .nav-icon { font-size: 20px; }
  .nav-item.active { color: var(--sj-bordeaux); }
  .nav-item.active .nav-icon { color: var(--sj-gold); }
  .nav-item:focus-visible { outline: 2px solid var(--sj-gold); outline-offset: -2px; }

  @media (min-width: 768px) {
    .app-nav {
      position: static; flex-direction: column; width: 220px; border-top: none;
      border-right: 1px solid var(--sj-border); padding-bottom: 0; justify-content: flex-start;
    }
    .nav-item { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 14px 20px; font-size: 15px; min-height: 48px; }
    .nav-item.active { background: var(--sj-bg-hover); border-right: 3px solid var(--sj-gold); }
  }

  /* ===== Countdown ===== */
  .countdown-card {
    background: linear-gradient(135deg, var(--sj-bordeaux), var(--sj-bordeaux-dark));
    color: #fff; border-radius: var(--sj-radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--sj-shadow);
  }
  .countdown-card .day-x { font-size: 26px; font-family: Georgia, serif; color: var(--sj-gold-light); }
  .countdown-card .remaining { font-size: 14px; color: #eadfce; margin-top: 2px; }
  .progress-track { height: 10px; background: rgba(255,255,255,0.18); border-radius: 6px; margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--sj-gold); border-radius: 6px; transition: width 0.4s ease; }

  /* ===== Cards / sections ===== */
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px 0; }
  .section-title h2 { font-size: 17px; }
  .dash-block { background: var(--sj-bg-card); border: 1px solid var(--sj-border); border-radius: var(--sj-radius); padding: 16px; margin-bottom: 16px; }
  .empty-state { color: var(--sj-text-muted); font-style: italic; padding: 14px 0; }
  .mini-list { list-style: none; margin: 0; padding: 0; }
  .mini-list li { padding: 8px 0; border-bottom: 1px solid var(--sj-border); display: flex; justify-content: space-between; gap: 10px; }
  .mini-list li:last-child { border-bottom: none; }
  .mini-list .muted { color: var(--sj-text-muted); font-size: 13px; }
  .warn-badge { color: var(--sj-danger); font-size: 12px; font-weight: 700; }
  .inspiration-box { background: var(--sj-bg-hover); border-left: 4px solid var(--sj-gold); border-radius: 8px; padding: 12px 14px; }

  /* ===== Chips / filters ===== */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: center; min-height: 36px; padding: 4px 14px;
    border-radius: 999px; border: 1px solid var(--sj-border); background: #fff; color: var(--sj-text-soft);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: var(--sj-bordeaux); color: #fff; border-color: var(--sj-bordeaux); }
  .counters { font-size: 14px; color: var(--sj-text-soft); margin-bottom: 14px; font-weight: 600; }

  /* ===== Dream / generic grid cards ===== */
  .card-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .card-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .card-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .item-card { background: var(--sj-bg-card); border: 1px solid var(--sj-border); border-radius: var(--sj-radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .item-card h3 { font-size: 16px; margin: 0; }
  .item-card .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
  .status-chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sj-bg-hover); color: var(--sj-text-soft); }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .stars { color: var(--sj-gold); font-size: 13px; }

  /* ===== Timeline ===== */
  .timeline { position: relative; padding-left: 26px; margin-top: 10px; }
  .timeline::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--sj-border); }
  .timeline-month { font-size: 12px; font-weight: 700; color: var(--sj-text-muted); text-transform: uppercase; margin: 18px 0 8px -26px; padding-left: 26px; letter-spacing: 0.05em; }
  .timeline-today {
    position: relative; margin: 10px 0 10px -26px; padding-left: 26px; font-size: 12px; font-weight: 700; color: var(--sj-bordeaux);
  }
  .timeline-today::before { content: ""; position: absolute; left: 3px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--sj-gold); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--sj-gold); }
  .timeline-item { position: relative; background: var(--sj-bg-card); border: 1px solid var(--sj-border); border-radius: var(--sj-radius-sm); padding: 12px 14px; margin-bottom: 10px; }
  .timeline-item::before { content: ""; position: absolute; left: -22px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--sj-bordeaux); }
  .timeline-item.past { opacity: 0.5; }
  .timeline-item .ev-title { font-weight: 700; }
  .timeline-item .ev-when { font-size: 13px; color: var(--sj-text-soft); }
  .timeline-item .ev-countdown { font-size: 12px; color: var(--sj-bordeaux); font-weight: 700; }

  /* ===== Board ===== */
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .board-col { min-width: 260px; flex: 1; background: var(--sj-bg-hover); border-radius: var(--sj-radius); padding: 10px; }
  .board-col.collapsed { min-width: auto; flex: 0 0 auto; }
  .board-col-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 10px 6px; font-weight: 700; color: var(--sj-bordeaux-dark); }
  .board-card { background: var(--sj-bg-card); border: 1px solid var(--sj-border); border-radius: var(--sj-radius-sm); padding: 10px; margin-bottom: 10px; }
  .board-card.warn { border-color: var(--sj-danger); box-shadow: 0 0 0 1px var(--sj-danger); }
  .board-card .next-action { font-size: 13px; margin: 6px 0; color: var(--sj-text-soft); }
  .board-card .next-action.empty { color: var(--sj-danger); font-weight: 700; }
  .board-card select { width: 100%; min-height: 40px; margin-top: 8px; border-radius: var(--sj-radius-sm); border: 1px solid var(--sj-border); }
  .board-card .card-actions { padding-top: 8px; }

  /* ===== Week ===== */
  .mood-row { display: flex; gap: 8px; }
  .mood-btn {
    flex: 1; min-height: 44px; border-radius: var(--sj-radius-sm); border: 1px solid var(--sj-border);
    background: #fff; cursor: pointer; font-size: 18px;
  }
  .mood-btn.active { background: var(--sj-gold); border-color: var(--sj-gold); }
  .past-week { border: 1px solid var(--sj-border); border-radius: var(--sj-radius-sm); margin-bottom: 10px; overflow: hidden; }
  .past-week summary { padding: 12px 14px; cursor: pointer; font-weight: 700; background: #fff; min-height: 44px; display: flex; align-items: center; }
  .past-week .pw-body { padding: 0 14px 14px 14px; font-size: 14px; color: var(--sj-text-soft); }
  .top3-list { list-style: decimal; padding-left: 20px; margin: 6px 0; }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(44,22,32,0.55); display: flex;
    align-items: flex-end; justify-content: center; z-index: 100; padding: 0;
  }
  @media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }
  .modal-content {
    background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0;
    max-height: 92vh; overflow-y: auto; box-shadow: var(--sj-shadow-lg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 640px) { .modal-content { border-radius: var(--sj-radius); } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--sj-border); position: sticky; top: 0; background: #fff; }
  .modal-header h3 { font-size: 18px; margin: 0; }
  .modal-body { padding: 18px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding-top: 8px; flex-wrap: wrap; }

  /* WIP dialog */
  .wip-dialog { text-align: center; }
  .wip-dialog .wip-icon { font-size: 40px; margin-bottom: 8px; }

  /* ===== Toasts ===== */
  .toast-container { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 200; pointer-events: none; }
  .toast { background: var(--sj-bordeaux-dark); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: var(--sj-shadow); max-width: 90vw; }
  .toast-error { background: var(--sj-danger); }
  .toast-success { background: var(--sj-success); }

  /* ===== Confetti ===== */
  .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti-piece { position: absolute; top: -12px; width: 8px; height: 14px; opacity: 0.9; border-radius: 2px; animation: confetti-fall 1.6s ease-in forwards; }
  @keyframes confetti-fall { to { transform: translateY(105vh) rotate(420deg); opacity: 0.25; } }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 480px) { .content { padding-left: 12px; padding-right: 12px; } }
</style>
</head>

<script type="module">
import { h, render } from "https://esm.sh/preact@10.19.3";

/* =========================================================================
   KONSTANTEN & DATUM (Europe/Berlin, unabhängig von Geräte-Zeitzone)
   ========================================================================= */
const SABBATICAL_START = "2026-07-30";
const SABBATICAL_END = "2027-09-11";

function pad2(n) { return String(n).padStart(2, "0"); }

function todayBerlinIso() {
  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Berlin", year: "numeric", month: "2-digit", day: "2-digit",
  });
  return fmt.format(new Date());
}
function isoToUtcDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function daysBetween(isoA, isoB) {
  return Math.round((isoToUtcDate(isoB) - isoToUtcDate(isoA)) / 86400000);
}
const TOTAL_DAYS = daysBetween(SABBATICAL_START, SABBATICAL_END) + 1; // 409

function getCountdown() {
  const todayIso = todayBerlinIso();
  let dayX = daysBetween(SABBATICAL_START, todayIso) + 1;
  dayX = Math.max(1, Math.min(TOTAL_DAYS, dayX));
  return {
    dayX, totalDays: TOTAL_DAYS, remaining: TOTAL_DAYS - dayX,
    progress: dayX / TOTAL_DAYS, todayIso,
  };
}
function currentMondayIsoBerlin() {
  const d = isoToUtcDate(todayBerlinIso());
  const day = d.getUTCDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setUTCDate(d.getUTCDate() + diff);
  return d.toISOString().slice(0, 10);
}
function pbDateToJs(v) {
  if (!v) return null;
  return new Date(String(v).replace(" ", "T"));
}
function isoDateOnly(v) {
  if (!v) return "";
  return String(v).slice(0, 10);
}
function formatDeDate(iso) {
  if (!iso) return "";
  const d = isoToUtcDate(isoDateOnly(iso));
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
}
function eventCountdownLabel(dateIso, todayIso) {
  if (!dateIso) return "";
  const n = daysBetween(todayIso, isoDateOnly(dateIso));
  if (n === 0) return "heute";
  if (n > 0) return `in ${n} Tag${n === 1 ? "" : "en"}`;
  return `vor ${Math.abs(n)} Tag${Math.abs(n) === 1 ? "" : "en"}`;
}
function nowIso() { return new Date().toISOString(); }
function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

const PROJECT_STATUS_LABELS = { idee: "Idee", aktiv: "Aktiv", pausiert: "Pausiert", abgeschlossen: "Abgeschlossen", verworfen: "Verworfen" };

/* =========================================================================
   NORMALIZER — jedes gespeicherte Feld MUSS hier auftauchen
   (Skill normalizer-drift-reload-bug: sonst verschwindet es beim Reload)
   ========================================================================= */
function asObj(v, fallback) {
  if (v && typeof v === "object") return v;
  if (typeof v === "string" && v) { try { return JSON.parse(v); } catch (e) { return fallback; } }
  return fallback;
}
function normalizeDream(r) {

async function loadPocketBaseSdk() {
  const sources = [
    "https://esm.sh/pocketbase@0.27.0",
    "https://cdn.jsdelivr.net/npm/pocketbase@0.27.0/+esm",
  ];
  let lastErr = null;
  for (const url of sources) {
    try {
      const modPromise = import(/* @vite-ignore */ url);
      const mod = await Promise.race([
        modPromise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("CDN-Timeout: " + url)), 8000)),
      ]);
      const PocketBase = mod.default || mod.PocketBase || mod;
      if (PocketBase) return PocketBase;
    } catch (err) {
      lastErr = err;
      console.warn("PocketBase-SDK von", url, "nicht ladbar:", err);
    }
  }
  throw lastErr || new Error("PocketBase-SDK konnte von keiner CDN-Quelle geladen werden.");
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((message, type) => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type: type || "info" }]);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3500);
  }, []);
  return { toasts, show };
}
function ToastContainer({ toasts }) {
  return html`
    <div class="toast-container" aria-live="polite">
      ${toasts.map((t) => html`<div class="toast toast-${t.type}" key=${t.id}>${t.message}</div>`)}
    </div>
  `;
}

function triggerConfetti() {
  const colors = ["#c9a227", "#5c1a2e", "#ddb94f", "#7d2c44", "#4f7a5c"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  for (let i = 0; i < 36; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = Math.random() * 0.3 + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1900);
}

/* =========================================================================
   MODAL (mit ESC-Hierarchie über escRegister)
   ========================================================================= */
function Modal({ title, onClose, children, escRegister }) {
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  // useLayoutEffect (NICHT useEffect): läuft synchron nach dem DOM-Update, also
  // bevor das Modal sichtbar gepaintet ist. Mit useEffect (nach dem Paint) gibt es
  // ein Zeitfenster, in dem das Modal schon im DOM steht, aber noch kein
  // ESC-Handler registriert ist — ein sehr früher ESC-Tastendruck ginge verloren
  // (genau das ließ die E2E-Tests „ESC schließt Modal" rot werden).
  useLayoutEffect(() => {
    const fn = () => closeRef.current();
    const unregister = escRegister(fn);
    return unregister;
  }, [escRegister]);
  return html`
    <div class="modal-overlay" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="modal-content" role="dialog" aria-modal="true" aria-label=${title}>
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="icon-btn" aria-label="Schließen" onClick=${onClose}>✕</button>
        </div>
        <div class="modal-body">${children}</div>
      </div>
    </div>
  `;
}

    finally { setBusy(false); }
  }
  async function submitPb(e) {
    e.preventDefault();
    setBusy(true); setError("");
    try { await onLogin(email, password); }
    catch (err) {
      const msg = err && err.status === 400 ? "E-Mail oder Passwort falsch."
        : (err && err.message) || "Anmeldung fehlgeschlagen.";
      setError(msg);
    } finally { setBusy(false); }

  let hostLabel = "";

          <form onSubmit=${submitPb}>
            <div class="field">
              <label for="pwEmail">E-Mail</label>
              <input id="pwEmail" type="email" required autocomplete="username"
                value=${email} onInput=${(e) => setEmail(e.target.value)} />
            </div>
            <div class="field">
              <label for="pwPassword">Passwort</label>
              <input id="pwPassword" type="password" required autocomplete="current-password"
                value=${password} onInput=${(e) => setPassword(e.target.value)} />
            </div>
            ${error && html`<p class="error-text" id="loginError">${error}</p>`}
            <button id="loginBtn" type="submit" class="btn btn-gold btn-block" disabled=${busy}>
              ${busy ? "Meldet an …" : "Anmelden"}
            </button>
          </form>
          <p class="login-hint">Passwort vergessen? Norbert ändert es im PocketBase-Admin. Es gibt keine Registrierung.</p>
        `}
        <p class="login-host">Backend: ${isDemo ? "Demo (kein Backend)" : hostLabel}</p>
      </div>
    </div>
  `;

   ========================================================================= */
function DashboardView({ dreams, events, projects, currentWeek, onNavigate }) {
  const cd = useMemo(() => getCountdown(), []);
  const [inspiration, setInspiration] = useState(null);
  useEffect(() => {
    if (!dreams.length) return;
    const ideas = dreams.filter((d) => d.status === "idee");
    if (!ideas.length) { setInspiration(null); return; }
    if (!inspiration || inspiration.status !== "idee" || !ideas.some((d) => d.id === inspiration.id)) {
      setInspiration(ideas[Math.floor(Math.random() * ideas.length)]);
    }
    // eslint-disable-next-line
  }, [dreams]);

  const upcoming = useMemo(() => {
    return events
      .filter((e) => isoDateOnly(e.date_start) >= cd.todayIso)
      .sort((a, b) => isoDateOnly(a.date_start).localeCompare(isoDateOnly(b.date_start)))
      .slice(0, 3);
  }, [events, cd.todayIso]);

  const activeProjects = useMemo(() => projects.filter((p) => p.status === "aktiv").slice(0, 3), [projects]);
  const frog = currentWeek && currentWeek.plan ? currentWeek.plan.frog : "";

  return html`
    <div data-view-content="dashboard">
      <div class="countdown-card">
        <div class="day-x">Tag ${cd.dayX} von ${cd.totalDays}</div>
        <div class="remaining">
          ${cd.remaining > 0 ? `Noch ${cd.remaining} Tage bis 11.09.2027` : "Das Sabbatjahr ist zu Ende."}
        </div>
        <div class="progress-track"><div class="progress-fill" style=${{ width: (cd.progress * 100) + "%" }}></div></div>
      </div>

      <div class="section-title"><h2>Nächste Termine</h2></div>
      <div class="dash-block">
        ${upcoming.length === 0
          ? html`<p class="empty-state">Keine anstehenden Termine — schau in der Timeline vorbei.</p>`
          : html`
            <ul class="mini-list">
              ${upcoming.map((e) => html`
                <li key=${e.id}>
                  <span>${e.title}</span>
                  <span class="muted">${formatDeDate(e.date_start)} · ${eventCountdownLabel(e.date_start, cd.todayIso)}</span>
                </li>
              `)}
            </ul>
          `}
      </div>

      <div class="section-title"><h2>Aktive Projekte</h2></div>
      <div class="dash-block">
        ${activeProjects.length === 0
          ? html`<p class="empty-state">Kein aktives Projekt. Schau im Scanner-Board vorbei.</p>`
          : html`
            <ul class="mini-list">
              ${activeProjects.map((p) => html`
                <li key=${p.id}>
                  <span>${p.title}</span>
                  ${p.next_action
                    ? html`<span class="muted">${p.next_action}</span>`
                    : html`<span class="warn-badge">offenes Ende</span>`}
                </li>
              `)}
            </ul>
          `}
      </div>

      <div class="section-title"><h2>Frosch der Woche</h2></div>
      <div class="dash-block">
        ${frog
          ? html`<p>${frog}</p>`
          : html`<p class="empty-state">Noch nicht gesetzt.
              <a href="#" onClick=${(e) => { e.preventDefault(); onNavigate("week"); }}>In der Woche-Ansicht eintragen →</a></p>`}
      </div>

      ${inspiration && html`
        <div class="section-title"><h2>Schon mal drüber nachgedacht?</h2></div>
        <div class="inspiration-box">
          <strong>${inspiration.title}</strong>
          ${inspiration.description && html`<p style=${{ margin: "6px 0 0 0" }}>${inspiration.description}</p>`}
        </div>
      `}
    </div>
  `;
}

function DreamsView({ dreams, projects, dataService, onDreamsChange, toast, escRegister }) {
  const [catFilter, setCatFilter] = useState("alle");
  const [statusFilter, setStatusFilter] = useState("alle");
  const [modalDream, setModalDream] = useState(undefined); // undefined = closed, null = new, obj = edit

  const filtered = dreams.filter((d) =>
    (catFilter === "alle" || d.category === catFilter) &&
    (statusFilter === "alle" || d.status === statusFilter)
  );
  const counts = {
    total: dreams.length,
    geplant: dreams.filter((d) => d.status === "geplant").length,
    erlebt: dreams.filter((d) => d.status === "erlebt").length,
  };

  async function handleSave(payload) {
    if (modalDream) {
      const updated = await dataService.updateDream(modalDream.id, payload);
      onDreamsChange(dreams.map((d) => (d.id === updated.id ? updated : d)));
    } else {
      const created = await dataService.createDream(payload);
      onDreamsChange([created, ...dreams]);
    }
    setModalDream(undefined);
    toast("Traum gespeichert.", "success");
  }
  async function handleDelete(dream) {
    if (!confirm(`"${dream.title}" wirklich löschen?`)) return;
    try {
      await dataService.deleteDream(dream.id);
      onDreamsChange(dreams.filter((d) => d.id !== dream.id));
      toast("Traum gelöscht.", "info");
    } catch (err) { toast("Löschen fehlgeschlagen.", "error"); }
  }
  async function handleMakeProject(dream) {
    try {
      const { project, dream: updatedDream } = await dataService.dreamToProject(dream);
      onDreamsChange(dreams.map((d) => (d.id === updatedDream.id ? updatedDream : d)));
      toast(`Projekt "${project.title}" angelegt.`, "success");
    } catch (err) { toast("Projekt anlegen fehlgeschlagen.", "error"); }
  }

  return html`
    <div data-view-content="dreams">

          <button key=${c} class="chip ${catFilter === c ? "active" : ""}" onClick=${() => setCatFilter(c)}>${CATEGORY_LABELS[c]}</button>
        `)}
      </div>
      <div class="chip-row">
        <button class="chip ${statusFilter === "alle" ? "active" : ""}" onClick=${() => setStatusFilter("alle")}>Alle Status</button>
        ${DREAM_STATUSES.map((s) => html`
          <button key=${s} class="chip ${statusFilter === s ? "active" : ""}" onClick=${() => setStatusFilter(s)}>${DREAM_STATUS_LABELS[s]}</button>
        `)}
      </div>

      ${filtered.length === 0
        ? html`<p class="empty-state">Keine Träume mit diesem Filter — leg einen neuen an oder wechsle den Filter.</p>`
        : html`
          <div class="card-grid">
            ${filtered.map((d) => html`
              <div class="item-card" key=${d.id}>
                <h3>${d.title}</h3>
                <div class="card-meta">
                  <span class="tag" style=${{ background: CATEGORY_COLORS[d.category] }}>${CATEGORY_LABELS[d.category]}</span>
                  <span class="status-chip">${DREAM_STATUS_LABELS[d.status]}</span>

                ${d.target_month && html`<p class="muted" style=${{ margin: 0, fontSize: "13px", color: "var(--sj-text-muted)" }}>Ziel: ${d.target_month}</p>`}
                ${d.description && html`<p style=${{ margin: 0, fontSize: "14px" }}>${d.description}</p>`}

      ${modalDream !== undefined && html`

function TimelineView({ events, dataService, onEventsChange, toast, escRegister }) {
  const [catFilter, setCatFilter] = useState("alle");
  const [modalEvent, setModalEvent] = useState(undefined);
  const cd = useMemo(() => getCountdown(), []);

  const filtered = events
    .filter((e) => catFilter === "alle" || e.category === catFilter)
    .slice()
    .sort((a, b) => isoDateOnly(a.date_start).localeCompare(isoDateOnly(b.date_start)));

  // Gruppierung nach Monat, "Heute"-Linie einfügen
  const rows = [];
  let lastMonth = "";
  let todayInserted = false;
  filtered.forEach((e) => {
    const dOnly = isoDateOnly(e.date_start);
    const monthKey = dOnly.slice(0, 7);
    if (!todayInserted && dOnly >= cd.todayIso) {
      rows.push({ type: "today" });
      todayInserted = true;
    }
    if (monthKey !== lastMonth) {
      const label = isoToUtcDate(dOnly + "").toLocaleDateString("de-DE", { month: "long", year: "numeric", timeZone: "UTC" });
      rows.push({ type: "month", label });
      lastMonth = monthKey;
    }
    rows.push({ type: "event", event: e });
  });
  if (!todayInserted) rows.push({ type: "today" });

  async function handleSave(payload) {
    if (modalEvent) {
      const updated = await dataService.updateEvent(modalEvent.id, payload);
      onEventsChange(events.map((e) => (e.id === updated.id ? updated : e)));
    } else {
      const created = await dataService.createEvent(payload);
      onEventsChange([...events, created]);
    }
    setModalEvent(undefined);
    toast("Termin gespeichert.", "success");
  }
  async function handleDelete(event) {
    if (!confirm(`"${event.title}" wirklich löschen?`)) return;
    try {
      await dataService.deleteEvent(event.id);
      onEventsChange(events.filter((e) => e.id !== event.id));
      toast("Termin gelöscht.", "info");
    } catch (err) { toast("Löschen fehlgeschlagen.", "error"); }
  }

  return html`
    <div data-view-content="timeline">
      <div class="section-title"><h2>Timeline</h2>
        <button class="btn btn-gold btn-sm" onClick=${() => setModalEvent(null)}>+ Neuer Termin</button>
      </div>
      <div class="chip-row">
        <button class="chip ${catFilter === "alle" ? "active" : ""}" onClick=${() => setCatFilter("alle")}>Alle Kategorien</button>
        ${EVENT_CATEGORIES.map((c) => html`
          <button key=${c} class="chip ${catFilter === c ? "active" : ""}" onClick=${() => setCatFilter(c)}>${CATEGORY_LABELS[c]}</button>
        `)}
      </div>
      ${filtered.length === 0
        ? html`<p class="empty-state">Keine Termine mit diesem Filter.</p>`
        : html`
          <div class="timeline">
            ${rows.map((r, i) => {
              if (r.type === "month") return html`<div class="timeline-month" key=${"m" + i}>${r.label}</div>`;
              if (r.type === "today") return html`<div class="timeline-today" key=${"t" + i}>Heute</div>`;
              const e = r.event;
              const isPast = isoDateOnly(e.date_start) < cd.todayIso;
              return html`
                <div class="timeline-item ${isPast ? "past" : ""}" key=${e.id}>
                  <div class="card-meta" style=${{ marginBottom: "4px" }}>
                    <span class="tag" style=${{ background: CATEGORY_COLORS[e.category] }}>${CATEGORY_LABELS[e.category]}</span>
                  </div>
                  <div class="ev-title">${e.title}</div>
                  <div class="ev-when">
                    ${formatDeDate(e.date_start)}${e.date_end ? " – " + formatDeDate(e.date_end) : ""}
                    ${e.location ? " · " + e.location : ""}
                  </div>
                  <div class="ev-countdown">${eventCountdownLabel(e.date_start, cd.todayIso)}</div>
                  <div class="card-actions">
                    <button class="btn btn-outline btn-sm" onClick=${() => setModalEvent(e)}>Bearbeiten</button>
                    <button class="btn btn-danger btn-sm" onClick=${() => handleDelete(e)}>Löschen</button>
                  </div>
                </div>
              `;
            })}
          </div>
        `}
      ${modalEvent !== undefined && html`
        <${EventModal} event=${modalEvent} onClose=${() => setModalEvent(undefined)} onSave=${handleSave} escRegister=${escRegister} />
      `}
    </div>
  `;
}

          <label for="prFinished">Abgeschlossen am</label>
          <input id="prFinished" type="date" value=${form.finished_at}
            onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, finished_at: v })); }} />
        </div>
      </div>
      <div class="field">
        <label for="prNotes">Notizen</label>
        <textarea id="prNotes" maxlength="5000" value=${form.notes}
          onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, notes: v })); }}></textarea>
      </div>
      ${error && html`<p class="error-text">${error}</p>`}
      <div class="modal-footer">
        <button class="btn btn-outline" onClick=${onClose}>Abbrechen</button>
        <button class="btn btn-gold" onClick=${handleSave}>Speichern</button>
      </div>
    <//>
  `;
}

function WipLimitDialog({ onClose, escRegister }) {
  return html`
    <${Modal} title="WIP-Limit erreicht" onClose=${onClose} escRegister=${escRegister}>
      <div class="wip-dialog">
        <div class="wip-icon">⏳</div>
        <p>Du hast schon 3 aktive Projekte.</p>
        <p><strong>Erst eins abschließen oder pausieren — du kennst dich.</strong></p>
        <div class="modal-footer" style=${{ justifyContent: "center" }}>
          <button class="btn btn-gold" onClick=${onClose}>Verstanden</button>
        </div>
      </div>
    <//>
  `;
}

function BoardView({ projects, dreams, dataService, onProjectsChange, toast, escRegister }) {
  const [modalProject, setModalProject] = useState(undefined);
  const [wipOpen, setWipOpen] = useState(false);
  const [collapsedDiscarded, setCollapsedDiscarded] = useState(true);

  function activeCount(excludeId) {
    return projects.filter((p) => p.status === "aktiv" && p.id !== excludeId).length;
  }

  async function applyStatusChange(project, newStatus) {
    const patch = { status: newStatus };
    if (newStatus === "aktiv" && !project.started_at) patch.started_at = todayBerlinIso();
    if (newStatus === "abgeschlossen" && !project.finished_at) patch.finished_at = todayBerlinIso();
    try {
      const updated = await dataService.updateProject(project.id, patch);
      onProjectsChange(projects.map((p) => (p.id === updated.id ? updated : p)));
      if (newStatus === "abgeschlossen") {
        triggerConfetti();
        toast("Geschafft! Projekt abgeschlossen. 🎉", "success");
      }
    } catch (err) { toast("Status ändern fehlgeschlagen.", "error"); }
  }

  function handleStatusChange(project, newStatus) {
    if (newStatus === "aktiv" && activeCount(project.id) >= MAX_ACTIVE_PROJECTS) {
      setWipOpen(true);
      return;
    }
    applyStatusChange(project, newStatus);
  }

  async function handleSaveModal(payload) {
    if (modalProject) {
      if (payload.status === "aktiv" && modalProject.status !== "aktiv" && activeCount(modalProject.id) >= MAX_ACTIVE_PROJECTS) {
        setWipOpen(true);
        return;
      }
      const patch = { ...payload };
      if (payload.status === "aktiv" && !modalProject.started_at && !patch.started_at) patch.started_at = todayBerlinIso();
      if (payload.status === "abgeschlossen" && !modalProject.finished_at && !patch.finished_at) patch.finished_at = todayBerlinIso();
      const updated = await dataService.updateProject(modalProject.id, patch);
      onProjectsChange(projects.map((p) => (p.id === updated.id ? updated : p)));
      if (payload.status === "abgeschlossen" && modalProject.status !== "abgeschlossen") {
        triggerConfetti();
        toast("Geschafft! Projekt abgeschlossen. 🎉", "success");
      } else {
        toast("Projekt gespeichert.", "success");
      }
    } else {
      if (payload.status === "aktiv" && activeCount(null) >= MAX_ACTIVE_PROJECTS) {
        setWipOpen(true);
        return;
      }
      const created = await dataService.createProject(payload);
      onProjectsChange([created, ...projects]);
      toast("Projekt angelegt.", "success");
    }
    setModalProject(undefined);
  }
  async function handleDelete(project) {
    if (!confirm(`"${project.title}" wirklich löschen?`)) return;
    try {
      await dataService.deleteProject(project.id);
      onProjectsChange(projects.filter((p) => p.id !== project.id));
      toast("Projekt gelöscht.", "info");
    } catch (err) { toast("Löschen fehlgeschlagen.", "error"); }
  }

  return html`
    <div data-view-content="board">
      <div class="section-title"><h2>Scanner-Board</h2>
        <button class="btn btn-gold btn-sm" onClick=${() => setModalProject(null)}>+ Neues Projekt</button>
      </div>
      <div class="board">
        ${PROJECT_STATUS_ORDER.map((status) => {
          const colProjects = projects.filter((p) => p.status === status);
          const isDiscarded = status === "verworfen";
          const collapsed = isDiscarded && collapsedDiscarded;
          const label = status === "aktiv"
            ? `Aktiv (${colProjects.length}/${MAX_ACTIVE_PROJECTS})`
            : `${PROJECT_STATUS_LABELS[status]} (${colProjects.length})`;
          return html`
            <div class="board-col ${collapsed ? "collapsed" : ""}" key=${status} data-board-col=${status}>
              <div class="board-col-header">
                <span>${label}</span>
                ${isDiscarded && html`
                  <button class="icon-btn" aria-label=${collapsed ? "Verworfen ausklappen" : "Verworfen einklappen"}
                    onClick=${() => setCollapsedDiscarded(!collapsedDiscarded)}>
                    ${collapsed ? "▸" : "▾"}
                  </button>
                `}
              </div>
              ${!collapsed && colProjects.map((p) => {
                const warn = p.status === "aktiv" && !p.next_action;
                return html`
                  <div class="board-card ${warn ? "warn" : ""}" key=${p.id}>
                    <strong>${p.title}</strong>
                    <div class="card-meta" style=${{ margin: "4px 0" }}>
                      <span class="tag" style=${{ background: CATEGORY_COLORS[p.area] }}>${CATEGORY_LABELS[p.area]}</span>
                    </div>
                    ${p.next_action
                      ? html`<p class="next-action">${p.next_action}</p>`
                      : html`<p class="next-action empty">offenes Ende — kein nächster Schritt</p>`}
                    <select aria-label="Status ändern für ${p.title}" value=${p.status}
                      onChange=${(e) => handleStatusChange(p, e.target.value)}>
                      ${PROJECT_STATUSES.map((s) => html`<option value=${s}>${PROJECT_STATUS_LABELS[s]}</option>`)}
                    </select>
                    <div class="card-actions">
                      <button class="btn btn-outline btn-sm" onClick=${() => setModalProject(p)}>Bearbeiten</button>
                      <button class="btn btn-danger btn-sm" onClick=${() => handleDelete(p)}>Löschen</button>
                    </div>
                  </div>
                `;
              })}
              ${!collapsed && colProjects.length === 0 && html`<p class="empty-state" style=${{ fontSize: "13px" }}>—</p>`}
            </div>
          `;
        })}
      </div>

      ${modalProject !== undefined && html`
        <${ProjectModal} project=${modalProject} dreams=${dreams}
          onClose=${() => setModalProject(undefined)} onSave=${handleSaveModal} escRegister=${escRegister} />
      `}
      ${wipOpen && html`<${WipLimitDialog} onClose=${() => setWipOpen(false)} escRegister=${escRegister} />`}
    </div>
  `;
}

   ========================================================================= */
function WeekView({ currentWeek, pastWeeks, projects, dataService, onWeekChange, toast }) {
  const [form, setForm] = useState(() => ({
    top3: currentWeek && currentWeek.plan.top3 ? [...currentWeek.plan.top3] : ["", "", ""],
    frog: currentWeek ? currentWeek.plan.frog : "",
    fokus_projekt_id: currentWeek ? currentWeek.plan.fokus_projekt_id || "" : "",
    gelungen: currentWeek ? currentWeek.review.gelungen : "",
    haengt: currentWeek ? currentWeek.review.haengt : "",
    gelernt: currentWeek ? currentWeek.review.gelernt : "",
    freude: currentWeek ? currentWeek.review.freude : "",
    mood: currentWeek ? currentWeek.mood : null,
  }));
  const formRef = useRef(form);
  useEffect(() => { formRef.current = form; }, [form]);
  const lastWeekId = useRef(currentWeek ? currentWeek.id : null);
  useEffect(() => {
    if (currentWeek && currentWeek.id !== lastWeekId.current) {
      lastWeekId.current = currentWeek.id;
      setForm({
        top3: currentWeek.plan.top3 ? [...currentWeek.plan.top3] : ["", "", ""],
        frog: currentWeek.plan.frog || "",
        fokus_projekt_id: currentWeek.plan.fokus_projekt_id || "",
        gelungen: currentWeek.review.gelungen || "", haengt: currentWeek.review.haengt || "",
        gelernt: currentWeek.review.gelernt || "", freude: currentWeek.review.freude || "",
        mood: currentWeek.mood || null,
      });
    }
  }, [currentWeek]);

  const activeProjects = projects.filter((p) => p.status === "aktiv");

  function setTop3(i, val) {
    setForm((prev) => {
      const next = [...prev.top3];
      next[i] = val;
      return { ...prev, top3: next };
    });
  }

  async function handleSave() {
    if (!currentWeek) return;
    const f = formRef.current;
    try {
      const updated = await dataService.updateWeek(currentWeek.id, {
        plan: { top3: f.top3, frog: f.frog, fokus_projekt_id: f.fokus_projekt_id || null },
        review: { gelungen: f.gelungen, haengt: f.haengt, gelernt: f.gelernt, freude: f.freude },
        mood: f.mood ? Number(f.mood) : null,
      });
      onWeekChange(updated);
      toast("Woche gespeichert.", "success");
    } catch (err) { toast("Speichern fehlgeschlagen.", "error"); }
  }

  if (!currentWeek) {
    return html`<div data-view-content="week"><p class="empty-state">Woche wird geladen …</p></div>`;
  }

  return html`
    <div data-view-content="week">
      <div class="section-title"><h2>Diese Woche</h2></div>
      <div class="dash-block">
        <label>Top 3 dieser Woche</label>
        ${[0, 1, 2].map((i) => html`
          <input key=${i} type="text" class="field" style=${{ width: "100%", marginBottom: "8px", minHeight: "44px", padding: "8px 10px", borderRadius: "8px", border: "1px solid var(--sj-border)" }}
            value=${form.top3[i] || ""} placeholder=${"Punkt " + (i + 1)}
            onInput=${(e) => { const v = e.target.value; setTop3(i, v); }} />
        `)}
        <div class="field">
          <label for="weekFrog">Frosch der Woche (die eine unangenehme Sache)</label>
          <input id="weekFrog" type="text" value=${form.frog}
            onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, frog: v })); }} />
        </div>
        <div class="field">
          <label for="weekFokus">Fokus-Projekt (optional)</label>
          <select id="weekFokus" value=${form.fokus_projekt_id}
            onChange=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, fokus_projekt_id: v })); }}>
            <option value="">— kein Fokus —</option>
            ${activeProjects.map((p) => html`<option value=${p.id}>${p.title}</option>`)}
          </select>
        </div>
        <label>Stimmung</label>
        <div class="mood-row">
          ${[1, 2, 3, 4, 5].map((m) => html`
            <button key=${m} type="button" class="mood-btn ${Number(form.mood) === m ? "active" : ""}"
              aria-label=${"Stimmung " + m + " von 5"}
              onClick=${() => setForm((prev) => ({ ...prev, mood: m }))}>${m}</button>
          `)}
        </div>
      </div>

      <div class="section-title"><h2>Wochen-Review</h2></div>
      <div class="dash-block">
        <div class="field">
          <label for="revGelungen">Was ist gelungen?</label>
          <textarea id="revGelungen" value=${form.gelungen}
            onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, gelungen: v })); }}></textarea>
        </div>
        <div class="field">
          <label for="revHaengt">Was hängt?</label>
          <textarea id="revHaengt" value=${form.haengt}
            onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, haengt: v })); }}></textarea>
        </div>
        <div class="field">
          <label for="revGelernt">Was habe ich gelernt?</label>
          <textarea id="revGelernt" value=${form.gelernt}
            onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, gelernt: v })); }}></textarea>
        </div>
        <div class="field">
          <label for="revFreude">Worauf freue ich mich?</label>
          <textarea id="revFreude" value=${form.freude}
            onInput=${(e) => { const v = e.target.value; setForm((prev) => ({ ...prev, freude: v })); }}></textarea>
        </div>
        <button class="btn btn-gold btn-block" onClick=${handleSave}>Woche speichern</button>
      </div>

      <div class="section-title"><h2>Rückblick</h2></div>
      ${pastWeeks.length === 0
        ? html`<p class="empty-state">Noch keine vergangenen Wochen.</p>`
        : pastWeeks.map((w) => html`
          <details class="past-week" key=${w.id}>
            <summary>${formatDeDate(w.week_start)} ${w.mood ? "· Stimmung " + w.mood + "/5" : ""}</summary>
            <div class="pw-body">
              ${w.plan.top3 && w.plan.top3.some(Boolean) && html`
                <div><strong>Top 3:</strong>
                  <ol class="top3-list">${w.plan.top3.filter(Boolean).map((t, i) => html`<li key=${i}>${t}</li>`)}</ol>
                </div>
              `}
              ${w.plan.frog && html`<p><strong>Frosch:</strong> ${w.plan.frog}</p>`}
              ${w.review.gelungen && html`<p><strong>Gelungen:</strong> ${w.review.gelungen}</p>`}
              ${w.review.haengt && html`<p><strong>Hängt:</strong> ${w.review.haengt}</p>`}
              ${w.review.gelernt && html`<p><strong>Gelernt:</strong> ${w.review.gelernt}</p>`}
              ${w.review.freude && html`<p><strong>Freude:</strong> ${w.review.freude}</p>`}
            </div>
          </details>
        `)}
    </div>
  `;
}

/* =========================================================================
   APP
   ========================================================================= */
function App() {
  const [dataService, setDataService] = useState(null);
  const [session, setSession] = useState(null); // null=prüft, false=ausgeloggt, obj=eingeloggt
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [dreams, setDreams] = useState([]);
  const [events, setEvents] = useState([]);
  const [projects, setProjects] = useState([]);
  const [weeks, setWeeks] = useState([]);
  const [currentWeek, setCurrentWeek] = useState(null);
  const { toasts, show: toast } = useToast();

  const escStackRef = useRef([]);
  const escRegister = useCallback((fn) => {
    escStackRef.current = [...escStackRef.current, fn];
    return () => { escStackRef.current = escStackRef.current.filter((f) => f !== fn); };
  }, []);
  useEffect(() => {
    function onKeyDown(e) {
      if (e.key !== "Escape") return;
      const stack = escStackRef.current;
      if (stack.length) stack[stack.length - 1]();
    }
    document.addEventListener("keydown", onKeyDown);
    return () => document.removeEventListener("keydown", onKeyDown);
  }, []);

  function handleApiError(err) {
    console.error(err);
    if (err && (err.status === 401 || err.status === 403)) {
      dataService && dataService.logout();
      setSession(false);
      toast("Sitzung abgelaufen — bitte neu anmelden.", "error");
      return;
    }
    toast("Etwas ist schiefgelaufen: " + ((err && err.message) || "Unbekannter Fehler"), "error");
  }

  async function loadAll(ds) {
    const [d, e, p, w] = await Promise.all([ds.getDreams(), ds.getEvents(), ds.getProjects(), ds.getWeeks()]);
    setDreams(d); setEvents(e); setProjects(p); setWeeks(w);
    try {
      const monday = currentMondayIsoBerlin();
      const week = await ds.getOrCreateWeek(monday);
      setCurrentWeek(week);
      setWeeks((prev) => (prev.some((x) => x.id === week.id) ? prev.map((x) => (x.id === week.id ? week : x)) : [week, ...prev]));
    } catch (err) { console.warn("Woche konnte nicht geladen/angelegt werden:", err); }
  }

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const ds = await createDataService();
      if (cancelled) return;
      setDataService(ds);
      if (ds.isLoggedIn()) {
        try { await loadAll(ds); setSession(ds.currentUser()); }
        catch (err) { handleApiError(err); setSession(false); }
      } else {
        setSession(false);
      }
      setLoading(false);
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, []);

  async function handleLogin(email, password) {
    await dataService.login(email, password);
    setSession(dataService.currentUser());
    try { await loadAll(dataService); } catch (err) { handleApiError(err); }
  }
  function handleLogout() {
    dataService.logout();
    setSession(false);
    setDreams([]); setEvents([]); setProjects([]); setWeeks([]); setCurrentWeek(null);
    setView("dashboard");
  }

  if (loading || !dataService) {
    return html`<div class="splash">Sabbatjahr wird geladen …</div>`;
  }
  if (!session) {
    return html`<${LoginScreen} isDemo=${dataService.isDemo} onLogin=${handleLogin} backendUrl=${PB_URL} />`;
  }

  const pastWeeks = weeks
    .filter((w) => !currentWeek || w.id !== currentWeek.id)
    .slice()
    .sort((a, b) => isoDateOnly(b.week_start).localeCompare(isoDateOnly(a.week_start)));

  return html`
    <div class="app-shell">
      <header class="app-header">
        <h1>Sabbatjahr</h1>
        <div style=${{ display: "flex", alignItems: "center", gap: "10px" }}>
          <span class="user-name">${session.name || session.email}</span>
          <button class="btn btn-outline btn-sm" style=${{ color: "#fff", borderColor: "rgba(255,255,255,0.4)" }} onClick=${handleLogout}>Abmelden</button>
        </div>
      </header>
      <div class="app-body">
        <${Nav} view=${view} onNavigate=${setView} />
        <main class="content" id="appContent">
          ${view === "dashboard" && html`
            <${DashboardView} dreams=${dreams} events=${events} projects=${projects} currentWeek=${currentWeek} onNavigate=${setView} />
          `}
          ${view === "dreams" && html`
            <${DreamsView} dreams=${dreams} projects=${projects} dataService=${dataService}
              onDreamsChange=${setDreams} toast=${toast} escRegister=${escRegister} />
          `}
          ${view === "timeline" && html`
            <${TimelineView} events=${events} dataService=${dataService}
              onEventsChange=${setEvents} toast=${toast} escRegister=${escRegister} />
          `}
          ${view === "board" && html`
            <${BoardView} projects=${projects} dreams=${dreams} dataService=${dataService}
              onProjectsChange=${setProjects} toast=${toast} escRegister=${escRegister} />
          `}
          ${view === "week" && html`
            <${WeekView} currentWeek=${currentWeek} pastWeeks=${pastWeeks} projects=${projects}
              dataService=${dataService} onWeekChange=${setCurrentWeek} toast=${toast} />
          `}
        </main>
      </div>
      <${ToastContainer} toasts=${toasts} />
    </div>
  `;
}

try {
  render(html`<${App} />`, document.getElementById("app"));
} catch (err) {
  console.error("Fataler Fehler beim Start:", err);
  document.getElementById("app").innerHTML =
    '<div class="fatal-error"><h2>Etwas ist schiefgelaufen</h2><p>' +
    (err && err.message ? err.message : "Unbekannter Fehler") +
    "</p></div>";
}
</script>
</body>
</html>
